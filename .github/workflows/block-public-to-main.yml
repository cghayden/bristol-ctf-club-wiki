name: Block public -> main PRs

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

jobs:
  block:
    runs-on: ubuntu-latest
    steps:
      - name: Fail if source branch is public
        run: |
          echo "Head ref: ${{ github.head_ref }}"
          if [ "${{ github.head_ref }}" = "public" ]; then
            echo "PRs from 'public' to 'main' are not allowed."
            exit 1
          fi